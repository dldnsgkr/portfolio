name: Deploy to GitHub Pages

# main 에 push 되면 그 커밋으로 빌드해 배포한다.
# 로컬에서 dist 를 직접 올리면 "배포된 것"과 "main 에 있는 것"이 어긋나므로
# 배포 경로를 여기 하나로 모은다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 연속 push 시 마지막 것만 배포한다.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc -b && vite build — 타입 오류가 있으면 여기서 배포가 멈춘다.
      - run: pnpm run build

      # CNAME 이 빠지면 커스텀 도메인 바인딩이 조용히 풀린다. 조용히 넘기지 않는다.
      - name: Verify CNAME
        run: |
          if [ ! -f dist/CNAME ]; then
            echo "::error::dist/CNAME 이 없다. public/CNAME 을 확인하라 — 배포하면 커스텀 도메인이 풀린다."
            exit 1
          fi
          echo "CNAME: $(cat dist/CNAME)"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
