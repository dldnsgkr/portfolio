name: Deploy to GitHub Pages

# main 에 push 되면 그 커밋으로 빌드해 배포한다.
# 로컬에서 dist 를 직접 올리면 "배포된 것"과 "main 에 있는 것"이 어긋나므로
# 배포 경로를 여기 하나로 모은다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 연속 push 시 마지막 것만 배포한다.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc -b && vite build — 타입 오류가 있으면 여기서 배포가 멈춘다.
      - run: pnpm run build

      # 커스텀 도메인을 뗐으므로 CNAME 검사도 뗀다. 대신 그 자리에서
      # base 를 지킨다 — vite 의 base 가 "/" 로 돌아가면 프로젝트 페이지에서
      # 에셋이 전부 404 나는데, 빌드는 성공하므로 조용히 깨진다.
      - name: Verify base path
        run: |
          if [ -f dist/CNAME ]; then
            echo "::error::dist/CNAME 이 있다. 커스텀 도메인은 더 이상 쓰지 않는다 — public/CNAME 을 지워라."
            exit 1
          fi
          if ! grep -q 'src="/portfolio/assets/' dist/index.html; then
            echo "::error::dist/index.html 이 /portfolio/ 를 가리키지 않는다. vite.config.ts 의 base 를 확인하라."
            exit 1
          fi
          echo "base OK: $(grep -o 'src="/portfolio/assets/[^"]*"' dist/index.html | head -1)"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
